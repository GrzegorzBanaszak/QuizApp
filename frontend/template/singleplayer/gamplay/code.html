<!DOCTYPE html>

<html class="dark" lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&amp;family=Be+Vietnam+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-high": "#1d1d39",
              "on-primary-fixed": "#000000",
              "primary-fixed-dim": "#d160ff",
              "on-primary": "#4f006c",
              "tertiary-fixed": "#00eefc",
              "secondary-fixed": "#ffc1d4",
              "on-primary-fixed-variant": "#4c0068",
              "surface": "#0c0c21",
              "inverse-primary": "#9a00cf",
              "surface-container-highest": "#232341",
              "on-secondary-fixed-variant": "#9f0059",
              "on-secondary-container": "#fff5f6",
              "on-tertiary": "#005d63",
              "surface-dim": "#0c0c21",
              "on-tertiary-fixed-variant": "#005e64",
              "outline": "#74738d",
              "surface-container-lowest": "#000000",
              "surface-variant": "#232341",
              "on-primary-container": "#3d0055",
              "on-secondary": "#460024",
              "on-surface": "#e5e3ff",
              "secondary-container": "#b90068",
              "outline-variant": "#46465e",
              "primary-fixed": "#d978ff",
              "secondary-dim": "#e10080",
              "on-surface-variant": "#aaa8c4",
              "inverse-on-surface": "#53536b",
              "error": "#ff6e84",
              "surface-container-low": "#111128",
              "primary-container": "#d978ff",
              "on-error": "#490013",
              "surface-bright": "#29294a",
              "primary": "#e08dff",
              "tertiary-container": "#00eefc",
              "on-secondary-fixed": "#6b003a",
              "surface-container": "#171730",
              "background": "#0c0c21",
              "tertiary": "#8ff5ff",
              "tertiary-fixed-dim": "#00deec",
              "tertiary-dim": "#00deec",
              "error-dim": "#d73357",
              "secondary-fixed-dim": "#ffacc8",
              "secondary": "#ff68a7",
              "on-tertiary-fixed": "#003f43",
              "on-tertiary-container": "#005359",
              "inverse-surface": "#fcf8ff",
              "error-container": "#a70138",
              "on-background": "#e5e3ff",
              "primary-dim": "#bc00fb",
              "on-error-container": "#ffb2b9",
              "surface-tint": "#e08dff"
            },
            fontFamily: {
              "headline": ["Spline Sans"],
              "body": ["Be Vietnam Pro"],
              "label": ["Be Vietnam Pro"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neon-pulse-bg {
            background: radial-gradient(circle at 50% 50%, #171730 0%, #0c0c21 100%);
            position: relative;
            overflow: hidden;
        }
        .neon-pulse-bg::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 50% 50%, rgba(224, 141, 255, 0.05) 0%, transparent 50%);
            top: -25%;
            left: -25%;
        }
        .glass-panel {
            background: rgba(41, 41, 74, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(224, 141, 255, 0.1);
        }
        .answer-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .answer-btn:hover {
            box-shadow: 0 0 20px rgba(224, 141, 255, 0.3);
            border-color: rgba(224, 141, 255, 0.6);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-[#0c0c21]/80 backdrop-blur-xl shadow-[0_0_20px_rgba(224,141,255,0.1)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#e08dff]" data-icon="timer">timer</span>
<span class="font-headline font-bold tracking-tight text-[#e5e3ff] text-xl">00:24</span>
</div>
<div class="absolute left-1/2 -translate-x-1/2 text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-[#e08dff] to-[#ff68a7]">
            QuizVolt
        </div>
<div class="flex items-center gap-6">
<span class="font-headline font-bold tracking-tight text-[#aaa8c4] hidden md:block">Pytanie 5 z 15</span>
<div class="bg-surface-bright px-4 py-1.5 rounded-full border border-primary/20">
<span class="font-headline font-bold tracking-tight text-[#e08dff]">1,240 pkt</span>
</div>
</div>
<div class="bg-gradient-to-r from-transparent via-[#e08dff]/20 to-transparent h-[1px] w-full absolute bottom-0 left-0"></div>
</header>
<!-- Main Gameplay Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-6 mt-16 mb-24 neon-pulse-bg">
<!-- Question Container -->
<div class="max-w-4xl w-full space-y-12">
<!-- Question Panel -->
<div class="glass-panel rounded-lg p-10 md:p-16 relative overflow-hidden group">
<!-- Decorative Light Leak -->
<div class="absolute -top-24 -right-24 w-64 height-64 bg-primary/10 blur-[80px] rounded-full"></div>
<!-- AI Badge -->
<div class="absolute top-6 right-6 flex items-center gap-2 px-3 py-1 rounded-md bg-surface-container-highest border border-outline-variant/30">
<span class="material-symbols-outlined text-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">AI Generated</span>
</div>
<!-- Progress Accent -->
<div class="absolute left-0 top-0 h-full w-1.5 bg-gradient-to-b from-primary to-secondary"></div>
<h1 class="text-3xl md:text-5xl font-headline font-extrabold text-center leading-tight tracking-tight text-on-surface">
                    Który z tych filmów otrzymał Oscara za najlepsze efekty specjalne?
                </h1>
</div>
<!-- Answers Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
<!-- Answer A -->
<button class="answer-btn group relative flex items-center gap-6 p-6 rounded-lg bg-surface-container border border-outline-variant/20 text-left hover:bg-surface-bright active:scale-95">
<span class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest border border-primary/30 font-headline font-black text-primary text-xl group-hover:bg-primary group-hover:text-on-primary transition-colors">A</span>
<span class="text-lg md:text-xl font-medium text-on-surface-variant group-hover:text-on-surface">Interstellar</span>
</button>
<!-- Answer B -->
<button class="answer-btn group relative flex items-center gap-6 p-6 rounded-lg bg-surface-container border border-outline-variant/20 text-left hover:bg-surface-bright active:scale-95">
<span class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest border border-primary/30 font-headline font-black text-primary text-xl group-hover:bg-primary group-hover:text-on-primary transition-colors">B</span>
<span class="text-lg md:text-xl font-medium text-on-surface-variant group-hover:text-on-surface">Mroczny Rycerz</span>
</button>
<!-- Answer C -->
<button class="answer-btn group relative flex items-center gap-6 p-6 rounded-lg bg-surface-container border border-outline-variant/20 text-left hover:bg-surface-bright active:scale-95">
<span class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest border border-primary/30 font-headline font-black text-primary text-xl group-hover:bg-primary group-hover:text-on-primary transition-colors">C</span>
<span class="text-lg md:text-xl font-medium text-on-surface-variant group-hover:text-on-surface">Wilk z Wall Street</span>
</button>
<!-- Answer D -->
<button class="answer-btn group relative flex items-center gap-6 p-6 rounded-lg bg-surface-container border border-outline-variant/20 text-left hover:bg-surface-bright active:scale-95">
<span class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest border border-primary/30 font-headline font-black text-primary text-xl group-hover:bg-primary group-hover:text-on-primary transition-colors">D</span>
<span class="text-lg md:text-xl font-medium text-on-surface-variant group-hover:text-on-surface">Pulp Fiction</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar (Action Section) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center items-center pb-10 bg-transparent">
<button class="flex flex-col items-center justify-center text-[#aaa8c4] opacity-70 hover:bg-[#ff68a7]/10 hover:text-[#ff68a7] hover:opacity-100 transition-all active:scale-95 duration-200 rounded-full px-8 py-3 group">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="logout">logout</span>
<span class="font-['Spline_Sans'] font-medium uppercase tracking-widest text-xs">Poddaj się</span>
</button>
</nav>
<!-- Decorative Elements -->
<div class="fixed top-1/4 -left-32 w-96 h-96 bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-32 w-96 h-96 bg-secondary/5 blur-[120px] rounded-full pointer-events-none"></div>
</body></html>
