<!DOCTYPE html>
<html class="dark" lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizVolt - Logowanie</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#0c0c21",
            surface: "#111128",
            surfaceHigh: "#171730",
            surfaceHighest: "#232341",
            outline: "#46465e",
            primary: "#e08dff",
            secondary: "#ff68a7",
            tertiary: "#8ff5ff",
            onSurface: "#e5e3ff",
            onSurfaceVariant: "#aaa8c4",
            onPrimary: "#4f006c"
          },
          borderRadius: {
            full: "9999px",
            xl: "1.5rem",
            "2xl": "2rem"
          },
          fontFamily: {
            headline: ["Spline Sans", "sans-serif"],
            body: ["Be Vietnam Pro", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(224, 141, 255, 0.14), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255, 104, 167, 0.12), transparent 30%),
        #0c0c21;
      color: #e5e3ff;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    .glass-panel {
      background: rgba(35, 35, 65, 0.42);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(5, 8, 22, 0.45);
    }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined", sans-serif;
      font-style: normal;
      line-height: 1;
    }
  </style>
</head>
<body class="antialiased">
  <main class="relative min-h-screen overflow-hidden px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
    <div class="pointer-events-none fixed left-[-10%] top-[-10%] h-[40vw] w-[40vw] max-h-[28rem] max-w-[28rem] rounded-full bg-primary/12 blur-[120px]"></div>
    <div class="pointer-events-none fixed bottom-[-10%] right-[-10%] h-[40vw] w-[40vw] max-h-[28rem] max-w-[28rem] rounded-full bg-secondary/12 blur-[120px]"></div>

    <div class="relative z-10 mx-auto flex min-h-[calc(100vh-3rem)] w-full max-w-5xl flex-col justify-center gap-8">
      <header class="text-center">
        <div class="mb-4 inline-block">
          <span class="bg-gradient-to-r from-primary to-secondary bg-clip-text font-headline text-3xl font-black italic tracking-tight text-transparent md:text-5xl">QuizVolt</span>
        </div>
        <h1 class="font-headline text-4xl font-black uppercase tracking-[-0.04em] text-[#f4d5ff] md:text-6xl">Logowanie</h1>
        <p class="mx-auto mt-4 max-w-3xl text-base font-medium tracking-wide text-onSurfaceVariant md:text-lg">
          Wybierz sposób logowania, aby zapisać postępy i odblokować katalogi gracza.
        </p>
      </header>

      <section class="glass-panel mx-auto w-full max-w-4xl rounded-[2rem] border border-outline/40 px-5 py-6 md:px-8 md:py-10">
        <div class="mb-6 text-center">
          <p class="text-xs font-black uppercase tracking-[0.32em] text-tertiary">Wybierz sposób logowania</p>
          <h2 class="mt-3 font-headline text-3xl font-black tracking-tight text-[#f4d5ff]">Wejdź do QuizVolt</h2>
          <p class="mx-auto mt-3 max-w-2xl text-sm text-onSurfaceVariant">
            Zaloguj się przez konto społecznościowe albo wejdź jako gość, żeby od razu zacząć grę.
          </p>
        </div>

        <div class="space-y-4">
          <button class="group flex w-full items-center justify-between rounded-full border border-outline/40 bg-[#171730]/85 px-5 py-4 text-left transition-all hover:border-primary/40 hover:bg-[#232341]">
            <div class="flex items-center gap-4">
              <div class="flex h-11 w-11 items-center justify-center rounded-full bg-[#f4d5ff] text-[#4f006c] shadow-[0_0_20px_rgba(224,141,255,0.25)]">
                <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.1-1.4 3.3-5.5 3.3-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3 14.7 2 12 2 6.5 2 2 6.5 2 12s4.5 10 10 10c5.8 0 9.7-4.1 9.7-9.8 0-.7-.1-1.2-.2-1.7H12z"></path>
                  <path fill="#FBBC05" d="M3.5 7.3 6.6 9.6C7.4 7.7 9.5 6 12 6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3 14.7 2 12 2 8.2 2 4.9 4 3.5 7.3z"></path>
                  <path fill="#34A853" d="M12 22c2.6 0 4.8-.9 6.4-2.4l-3-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.7-5.6-4.1L3.3 16.3C4.8 19.6 8 22 12 22z"></path>
                  <path fill="#4285F4" d="M21.7 12.2c0-.7-.1-1.2-.2-1.7H12v3.7h5.5c-.3 1.2-1 2.2-2.1 2.9l3 2.5c1.8-1.7 3.3-4.3 3.3-7.4z"></path>
                </svg>
              </div>
              <div>
                <p class="font-bold text-onSurface">Zaloguj przez Google</p>
                <p class="text-xs text-onSurfaceVariant">Szybka synchronizacja postępów</p>
              </div>
            </div>
            <span class="material-symbols-outlined text-onSurfaceVariant transition-transform group-hover:translate-x-1">chevron_right</span>
          </button>

          <button class="group flex w-full items-center justify-between rounded-full border border-outline/40 bg-[#171730]/85 px-5 py-4 text-left transition-all hover:border-tertiary/40 hover:bg-[#232341]">
            <div class="flex items-center gap-4">
              <div class="flex h-11 w-11 items-center justify-center rounded-full bg-[#1877F2] text-white shadow-[0_0_20px_rgba(24,119,242,0.25)]">
                <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12S0 5.446 0 12.073c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
                </svg>
              </div>
              <div>
                <p class="font-bold text-onSurface">Zaloguj przez Facebook</p>
                <p class="text-xs text-onSurfaceVariant">Dostęp do konta społecznościowego</p>
              </div>
            </div>
            <span class="material-symbols-outlined text-onSurfaceVariant transition-transform group-hover:translate-x-1">chevron_right</span>
          </button>

          <div class="flex items-center gap-4 py-2">
            <div class="h-px flex-1 bg-outline/40"></div>
            <span class="text-[10px] font-black uppercase tracking-[0.32em] text-[#74738d]">Lub</span>
            <div class="h-px flex-1 bg-outline/40"></div>
          </div>

          <button class="flex w-full items-center justify-center gap-3 rounded-full border-2 border-outline/30 bg-gradient-to-r from-primary to-secondary px-6 py-4 text-sm font-bold text-onPrimary transition-all hover:scale-[1.01]">
            <span class="material-symbols-outlined text-2xl">person</span>
            <span>Graj jako Gość</span>
          </button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
