version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quizapp-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-QuizApp}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
